services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: javascript-devsecops-starter:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:5173
      TRUST_PROXY: "false"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
